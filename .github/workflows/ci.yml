# DRAFT — ACTION_PLAN E2-06. Written but NOT run: this environment has no CI runner and
# no container registry credentials, so nothing here has executed end-to-end. The build
# + unit test steps mirror commands that WERE run and verified locally (see the build
# report); the integration-test step mirrors the local Testcontainers run that also
# passed locally on this machine. The image-push and registry steps are illustrative —
# REGISTRY/credentials must be filled in for a real account before this can run.
#
# The client job (N-42) is the same shape: `npm ci`, `ng build --configuration production`
# and the Karma suite under ChromeHeadless were all run and verified locally on this
# machine; what is unverified is only that a GitHub-hosted runner does the same.
#
# DR-11 note: this workflow assumes the GitHub-hosted runner can start Docker
# containers for Testcontainers (true for ubuntu-latest runners, which have Docker
# pre-installed) — that assumption is unverified here since there is no runner to try.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  DOTNET_VERSION: "10.0.203"
  NODE_VERSION: "24.20.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  # N-42: until this job existed, CI set up .NET only — no Node, no `npm ci`, no
  # `ng build` — so a frontend regression could not be caught by CI at all. It runs
  # independently of the .NET job because neither depends on the other's output; a
  # broken client should not hide a broken API, or vice versa.
  client-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      # Budgets are part of the production configuration (angular.json), so this step
      # is also what enforces them — a bundle over the error threshold fails the build.
      - name: Build (production)
        run: npm run build -- --configuration production

      # ubuntu-latest ships Chrome; ChromeHeadless + --watch=false is what makes the
      # Karma suite terminate rather than sit waiting for file changes.
      - name: Unit tests (Karma, headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/browser

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SourcingOps.sln

      - name: Build
        run: dotnet build SourcingOps.sln --no-restore -c Release

      - name: Unit tests (Application)
        run: dotnet test tests/SourcingOps.Application.Tests/SourcingOps.Application.Tests.csproj --no-build -c Release --logger trx --results-directory TestResults

      # Requires Docker on the runner for Testcontainers Postgres (TECH_SPEC §4.1, DR-11).
      # ubuntu-latest ships Docker pre-installed; this step is the CI verification that
      # DR-11 asks for and was NOT itself run here (no runner available in this session).
      - name: Integration tests (Api, Testcontainers Postgres)
        run: dotnet test tests/SourcingOps.Api.Tests/SourcingOps.Api.Tests.csproj --no-build -c Release --logger trx --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  build-and-push-images:
    needs: [build-and-test, client-build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/SourcingOps.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # client/Dockerfile builds the Angular app and serves it via nginx — same image
      # runs unchanged in every environment (client/src/app/core/services/api.service.ts
      # calls a relative `/api/v1` path, so there's no per-environment API URL to bake
      # in). Superseded the `client-dist` artifact + manual host-copy step this comment
      # used to reference — see docs/DEPLOY_SHARED_INFRA.md.
      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:latest

      # See deploy/deploy.sh for why this exists: the runtime `api` image has no SDK, so
      # migrations run from this separate, equally SDK-less migrator image instead — an
      # explicit deploy step (E2-07), never auto-applied by the api container. Mirrors
      # KlaraHome.Migrator's separate-image pattern rather than the previous
      # `dotnet ef migrations bundle` artifact, so a VPS deploy pulls/builds one more
      # image and runs it via `docker compose --profile migrate run --rm migrator`
      # instead of scp'ing a bundle file over.
      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/SourcingOps.Migrator/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator:latest

  # DRAFT, disabled by default — E2-05 (provisioning the real VPS) is explicitly out of
  # scope for this pass, so there is no SSH host/key to deploy to yet. Uncomment the
  # `if:` below and supply DEPLOY_HOST/DEPLOY_SSH_KEY secrets once the VPS exists.
  deploy:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: false # flip on once E2-05 has provisioned a real target
    steps:
      - name: Deploy over SSH
        run: |
          echo "On the VPS: git pull (or docker compose pull for the api/migrator images), then run deploy/deploy.sh there."
          echo "Not implemented — no deploy target exists yet (see E2-05)."
