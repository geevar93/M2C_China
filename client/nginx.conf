server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (mirrors the Caddyfile's `try_files {path} /index.html` — Angular's
    # router owns every path that isn't a real static asset).
    location / {
        try_files $uri /index.html;
    }

    # PWA: the service worker, its manifest and the web manifest must always be
    # revalidated, or a deploy would never reach installed clients. Declared
    # before the long-cache rule below, which would otherwise match the .js.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Hashed build filenames (Angular's default output-hashing) are safe to cache
    # aggressively; index.html itself falls through to nginx's default (no-cache-ish)
    # headers since a fresh deploy must always be picked up.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
