document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a7ef09d8-321d-48cb-9f87-f84ca2b235e0\"><\/script>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html,body{margin:0;padding:0}\n  body{background:#f8f9fb;color:#1a2332;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}\n  *{box-sizing:border-box}\n  a{color:#2d5be3;text-decoration:none}\n  a:hover{color:#2449b5;text-decoration:underline}\n  table{border-collapse:collapse;width:100%}\n  input,select,textarea,button{font-family:inherit}\n  @keyframes spin{to{transform:rotate(360deg)}}\n<\/style>\n<\/helmet>\n<div style=\"display:flex;height:100vh;overflow:hidden;background:#f8f9fb\">\n\n  <div style=\"width:{{sbW}}px;flex:0 0 auto;background:#1a2332;color:#fff;display:flex;flex-direction:column;overflow:hidden\">\n    <div style=\"height:56px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)\">\n      <div style=\"font-size:18px;font-weight:700;white-space:nowrap\">Meridian<span style=\"color:#2d5be3\">.<\/span><\/div>\n      <div style=\"font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.06em;white-space:nowrap;display:{{labelDisp}}\">SOURCING OPS<\/div>\n    <\/div>\n    <div style=\"flex:1 1 auto;overflow-y:auto;padding:12px 8px\">\n      <sc-for list=\"{{navGroups}}\" as=\"g\" hint-placeholder-count=\"4\">\n        <div style=\"margin-bottom:14px\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.35);padding:6px 12px;white-space:nowrap;display:{{labelDisp}}\">{{ g.label }}<\/div>\n          <sc-for list=\"{{g.items}}\" as=\"it\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ it.go }}\" title=\"{{ it.label }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;background:{{it.bg}};color:{{it.fg}};margin-bottom:2px;transition:background .15s\" style-hover=\"background:{{it.hoverBg}}\">\n              <span style=\"font-size:16px;flex:0 0 16px;line-height:1\">{{ it.icon }}<\/span>\n              <span style=\"font-size:14px;white-space:nowrap;display:{{labelDisp}}\">{{ it.label }}<\/span>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <div sc-camel-on-click=\"{{ toggleSb }}\" style=\"flex:0 0 auto;padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.55);font-size:13px;cursor:pointer;white-space:nowrap\" style-hover=\"color:#fff\">{{ collapseLabel }}<\/div>\n  <\/div>\n\n  <div style=\"flex:1 1 auto;display:flex;flex-direction:column;min-width:0\">\n    <div style=\"height:56px;flex:0 0 auto;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:16px;padding:0 24px\">\n      <div style=\"font-size:16px;font-weight:600;white-space:nowrap\">{{ pageTitle }}<\/div>\n      <div sc-camel-on-click=\"{{ openPalette }}\" style=\"flex:1 1 auto;max-width:420px;display:flex;align-items:center;gap:8px;border:1px solid #e5e7eb;border-radius:8px;padding:7px 12px;color:#6b7280;font-size:13px;cursor:pointer;transition:border-color .15s\" style-hover=\"border-color:#2d5be3\">\n        <span>⌕<\/span><span style=\"flex:1 1 auto\">Search customers, vendors, catalogs<\/span><span style=\"font-size:11px;border:1px solid #e5e7eb;border-radius:4px;padding:1px 5px\">⌘K<\/span>\n      <\/div>\n      <div style=\"flex:1 1 auto\"><\/div>\n      <div sc-camel-on-click=\"{{ refresh }}\" style=\"font-size:13px;color:#6b7280;cursor:pointer\">↻ Refresh<\/div>\n      <div style=\"width:1px;height:24px;background:#e5e7eb\"><\/div>\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <div style=\"width:28px;height:28px;border-radius:14px;background:#e3f2fd;color:#1565c0;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ userInitials }}<\/div>\n        <div style=\"font-size:13px\">{{ userName }} <span style=\"color:#6b7280\">· Owner<\/span><\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"flex:1 1 auto;overflow-y:auto;padding:24px\">\n\n      <sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:120px 0;color:#6b7280\">\n          <div style=\"width:20px;height:20px;border:2px solid #e5e7eb;border-top-color:#2d5be3;border-radius:50%;animation:spin .6s linear infinite\"><\/div>\n          <div style=\"font-size:13px\">Loading<\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{showDash}}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px\">\n            <div>\n              <h1 style=\"font-size:20px;font-weight:700;margin:0\">Operations Dashboard<\/h1>\n              <div style=\"font-size:13px;color:#6b7280;margin-top:4px\">Last 30 days · all categories · all service types<\/div>\n            <\/div>\n            <div style=\"display:flex;gap:8px\">\n              <sc-raw-select value=\"{{dateRange}}\" sc-camel-on-change=\"{{ setRange }}\" style=\"padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;background:#fff;color:#1a2332\">\n                <option>Last 7 days<\/option><option>Last 30 days<\/option><option>This quarter<\/option>\n              <\/sc-raw-select>\n              <button sc-camel-on-click=\"{{ goIntake }}\" style=\"background:#2d5be3;color:#fff;border:1px solid #2d5be3;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:500;cursor:pointer\">+ New Lead<\/button>\n            <\/div>\n          <\/div>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:16px\">\n            <sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)\">\n                <div style=\"font-size:13px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em\">{{ k.label }}<\/div>\n                <div style=\"font-size:28px;font-weight:700;margin-top:8px\">{{ k.value }}<\/div>\n                <div style=\"font-size:12px;color:{{k.subColor}};margin-top:4px\">{{ k.sub }}<\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n\n          <div style=\"display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px\">\n            <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px\">\n                <div style=\"font-size:14px;font-weight:600\">New Leads Over Time<\/div>\n                <div style=\"font-size:12px;color:#6b7280\">12 weeks · WhatsApp, calls, referrals<\/div>\n              <\/div>\n              <svg sc-camel-view-box=\"0 0 640 180\" style=\"width:100%;height:180px;display:block\" sc-camel-preserve-aspect-ratio=\"none\">\n                <line x1=\"0\" y1=\"45\" x2=\"640\" y2=\"45\" stroke=\"#f1f3f6\" stroke-width=\"1\"><\/line>\n                <line x1=\"0\" y1=\"90\" x2=\"640\" y2=\"90\" stroke=\"#f1f3f6\" stroke-width=\"1\"><\/line>\n                <line x1=\"0\" y1=\"135\" x2=\"640\" y2=\"135\" stroke=\"#f1f3f6\" stroke-width=\"1\"><\/line>\n                <line x1=\"0\" y1=\"179\" x2=\"640\" y2=\"179\" stroke=\"#e5e7eb\" stroke-width=\"1\"><\/line>\n                <polyline points=\"{{linePts}}\" fill=\"none\" stroke=\"#2d5be3\" stroke-width=\"2\"><\/polyline>\n              <\/svg>\n              <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-top:8px\">\n                <span>W18<\/span><span>W21<\/span><span>W24<\/span><span>W27<\/span><span>W30<\/span>\n              <\/div>\n            <\/div>\n\n            <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)\">\n              <div style=\"font-size:14px;font-weight:600;margin-bottom:16px\">Service Type Split<\/div>\n              <div style=\"display:flex;align-items:center;gap:20px\">\n                <svg sc-camel-view-box=\"0 0 120 120\" style=\"width:120px;height:120px;flex:0 0 120px\">\n                  <circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"#f57f17\" stroke-width=\"16\"><\/circle>\n                  <circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"#2d5be3\" stroke-width=\"16\" stroke-dasharray=\"{{donutDash}}\" transform=\"rotate(-90 60 60)\"><\/circle>\n                  <text x=\"60\" y=\"58\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#1a2332\">96<\/text>\n                  <text x=\"60\" y=\"74\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6b7280\">CUSTOMERS<\/text>\n                <\/svg>\n                <div style=\"display:flex;flex-direction:column;gap:12px\">\n                  <div>\n                    <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:2px;background:#2d5be3\"><\/span><span style=\"font-size:13px\">CIF (full-service)<\/span><\/div>\n                    <div style=\"font-size:18px;font-weight:700;margin-top:2px;padding-left:18px\">60 <span style=\"font-size:12px;font-weight:400;color:#6b7280\">· 62%<\/span><\/div>\n                  <\/div>\n                  <div>\n                    <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:2px;background:#f57f17\"><\/span><span style=\"font-size:13px\">Freight-only<\/span><\/div>\n                    <div style=\"font-size:18px;font-weight:700;margin-top:2px;padding-left:18px\">36 <span style=\"font-size:12px;font-weight:400;color:#6b7280\">· 38%<\/span><\/div>\n                  <\/div>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px\">\n            <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)\">\n              <div style=\"font-size:14px;font-weight:600;margin-bottom:16px\">Lead Funnel<\/div>\n              <sc-for list=\"{{funnel}}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"margin-bottom:12px\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px\"><span>{{ f.label }}<\/span><span style=\"color:#6b7280\">{{ f.n }} · {{ f.pct }}<\/span><\/div>\n                  <div style=\"height:8px;background:#f1f3f6;border-radius:4px;overflow:hidden\"><div style=\"height:8px;background:#2d5be3;border-radius:4px;width:{{f.w}}%\"><\/div><\/div>\n                <\/div>\n              <\/sc-for>\n              <div style=\"border-top:1px solid #e5e7eb;padding-top:12px;margin-top:4px;font-size:13px;color:#6b7280\">Lead → Won conversion <strong style=\"color:#1a2332\">18.0%<\/strong><\/div>\n            <\/div>\n\n            <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)\">\n              <div style=\"font-size:14px;font-weight:600;margin-bottom:16px\">Category Mix<\/div>\n              <sc-for list=\"{{catMix}}\" as=\"c\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">\n                  <div style=\"width:74px;font-size:13px;color:#6b7280\">{{ c.label }}<\/div>\n                  <div style=\"flex:1 1 auto;height:8px;background:#f1f3f6;border-radius:4px;overflow:hidden\"><div style=\"height:8px;background:#1a2332;border-radius:4px;width:{{c.w}}%\"><\/div><\/div>\n                  <div style=\"width:24px;text-align:right;font-size:13px;font-weight:600\">{{ c.n }}<\/div>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n\n            <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)\">\n              <div style=\"font-size:14px;font-weight:600;margin-bottom:16px\">Shipments by Status<\/div>\n              <sc-for list=\"{{shipStat}}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">\n                  <div style=\"width:78px\"><span style=\"display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:{{s.bg}};color:{{s.fg}}\">{{ s.label }}<\/span><\/div>\n                  <div style=\"flex:1 1 auto;height:8px;background:#f1f3f6;border-radius:4px;overflow:hidden\"><div style=\"height:8px;background:{{s.fg}};border-radius:4px;width:{{s.w}}%\"><\/div><\/div>\n                  <div style=\"width:28px;text-align:right;font-size:13px;font-weight:600\">{{ s.n }}<\/div>\n                <\/div>\n              <\/sc-for>\n              <div style=\"border-top:1px solid #e5e7eb;padding-top:12px;margin-top:4px;font-size:13px;color:#6b7280\">2 shipments overdue on ETA<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{showCustomers}}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px\">\n            <h1 style=\"font-size:20px;font-weight:700;margin:0\">Customers<\/h1>\n            <button sc-camel-on-click=\"{{ goIntake }}\" style=\"background:#2d5be3;color:#fff;border:1px solid #2d5be3;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:500;cursor:pointer\">+ New Lead<\/button>\n          <\/div>\n\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px\">\n            <div style=\"flex:1 1 220px;min-width:180px\">\n              <label style=\"display:block;font-size:13px;font-weight:500;margin-bottom:6px\">Search<\/label>\n              <input value=\"{{fSearch}}\" sc-camel-on-change=\"{{ setSearch }}\" placeholder=\"Name, business, or number\" style=\"width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;transition:border-color .15s\" style-focus=\"border-color:#2d5be3;outline:none\">\n            <\/div>\n            <div>\n              <label style=\"display:block;font-size:13px;font-weight:500;margin-bottom:6px\">Service Type<\/label>\n              <sc-raw-select value=\"{{fService}}\" sc-camel-on-change=\"{{ setService }}\" style=\"padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;background:#fff;min-width:150px\">\n                <option>All service types<\/option><option>CIF<\/option><option>Freight-only<\/option>\n              <\/sc-raw-select>\n            <\/div>\n            <div>\n              <label style=\"display:block;font-size:13px;font-weight:500;margin-bottom:6px\">Status<\/label>\n              <sc-raw-select value=\"{{fStatus}}\" sc-camel-on-change=\"{{ setStatus }}\" style=\"padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;background:#fff;min-width:130px\">\n                <option>All statuses<\/option><option>NEW<\/option><option>QUALIFIED<\/option><option>ACTIVE<\/option><option>WON<\/option><option>LOST<\/option><option>DORMANT<\/option>\n              <\/sc-raw-select>\n            <\/div>\n            <div>\n              <label style=\"display:block;font-size:13px;font-weight:500;margin-bottom:6px\">Category<\/l
