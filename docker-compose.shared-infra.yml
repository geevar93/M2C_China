services:
  api:
    environment:
      - ConnectionStrings__Default=${DATABASE_CONNECTION_STRING:?set in .env}
      - Caching__Provider=Redis
      - Caching__Redis__ConnectionString=${REDIS_CONNECTION_STRING:?set in .env}
      - Storage__Provider=S3
      - Storage__S3__ServiceUrl=${STORAGE_S3_SERVICE_URL:-http://klarahome-minio:9000}
    depends_on: !reset null
    networks:
      - default
      - klarahome-data
      - web
    volumes:
      - dpkeys:/home/app/.aspnet/DataProtection-Keys

  # Same client image, no manual build/copy step — just needs to be reachable from the
  # existing shared `caddy` container, so it joins `web` instead of publishing a port.
  # Still carries the base file's `profiles: ["prod"]` (compose merges `profiles`
  # across -f files as a set union — a `profiles: []` override here does NOT clear it,
  # verified against docker compose 29.4.0's `config` output), so bring-up still needs
  # `--profile prod` even though the bundled `caddy` that flag was originally for is
  # reset away below.
  client:
    networks:
      - default
      - web

  migrator:
    environment:
      - ConnectionStrings__Default=${DATABASE_CONNECTION_STRING:?set in .env}
    depends_on: !reset null
    networks:
      - default
      - klarahome-data

  db: !reset null
  redis: !reset null
  minio: !reset null
  caddy: !reset null

networks:
  klarahome-data:
    external: true
  web:
    external: true

volumes:
  pgdata: !reset null
  caddy-data: !reset null
  caddy-config: !reset null
  miniodata: !reset null
  dpkeys: